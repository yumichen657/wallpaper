<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>雪夜動態桌布</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #050a1c; overflow: hidden;
    font-family: system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif; }

  /* 舞台：所有圖層疊在一起（越下面越靠近鏡頭） */
  .stage { position: fixed; inset: 0; overflow: hidden; }
  .full { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  /* ① 雪夜世界：五層，每層的鏡頭移動幅度不同（數值寫在各層的 style 裡） */
  .wl { position: absolute; inset: -6%; will-change: transform; animation: camW 20s ease-in-out infinite alternate; }
  .wl canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  @keyframes camW { from { transform: scale(var(--s0)) translate(var(--x0), 0); } to { transform: scale(var(--s1)) translate(var(--x1), var(--y1)); } }

  /* ③ 人物：右下角，移動幅度比背景大（視差）＋呼吸；頭髮飄動在 WebGL 裡做 */
  #chara { position: absolute; right: 0; bottom: 0; will-change: transform; animation: camChara 18s ease-in-out infinite alternate; }
  #charaGL { display: block; width: 100%; height: 100%; transform-origin: 50% 100%; animation: breath 4.2s ease-in-out infinite; }
  @keyframes camChara { from { transform: translate(-1.5%, 0) scale(1); } to { transform: translate(1%, -.6%) scale(1.02); } }
  @keyframes breath { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.004, 1.01); } }

  .vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,.5) 100%); }

  /* FPS 顯示 */
  .fps { position: fixed; top: 10px; left: 10px; z-index: 6; background: rgba(0,0,0,.5); color: #b8ffb0;
    font: 600 12px/1.4 ui-monospace, Menlo, Consolas, monospace; padding: 4px 8px; border-radius: 8px; pointer-events: none; }
  .fps.low { color: #ffb0a0; }

  /* 面板 */
  .panel { position: fixed; left: 12px; bottom: 12px; z-index: 5; display: flex; flex-direction: column; gap: 8px;
    background: rgba(14,18,32,.78); color: #e8eefc; padding: 10px 12px; border-radius: 12px; font-size: 13px; width: min(300px, calc(100vw - 24px));
    backdrop-filter: blur(6px); transition: opacity .3s; }
  .panel.hide { opacity: 0; pointer-events: none; }
  .panel .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .panel label.row { cursor: pointer; }
  .panel input[type=file] { display: none; }
  .panel input[type=range] { flex: 1; accent-color: #c9d8ff; }
  .panel .val { min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
  .btn { background: #c9d8ff; color: #101830; border: 0; border-radius: 999px; padding: 4px 10px; font-weight: 600; white-space: nowrap; font-size: 13px; cursor: pointer; font-family: inherit; }
  .panel small { color: #aab6d4; line-height: 1.5; }
  .toggle { position: fixed; right: 12px; top: 10px; z-index: 6; background: rgba(14,18,32,.6); color: #fff; border: 0;
    border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  @media (prefers-reduced-motion: reduce) { .wl, #chara, #charaGL { animation: none !important; } }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <!-- ① 雪夜世界：五層（內容由 world.js 畫） -->
    <div id="world">
      <div class="wl" id="wSky"  style="--s0:1.02;--s1:1.05;--x0:-.4%;--x1:.4%;--y1:-.3%"><canvas class="st"></canvas><canvas class="an"></canvas></div>
      <div class="wl" id="wFar"  style="--s0:1.02;--s1:1.06;--x0:-.6%;--x1:.6%;--y1:-.4%"><canvas class="st"></canvas></div>
      <div class="wl" id="wMid"  style="--s0:1.02;--s1:1.07;--x0:-.9%;--x1:.9%;--y1:-.6%"><canvas class="st"></canvas><canvas class="an"></canvas></div>
      <div class="wl" id="wNear" style="--s0:1.02;--s1:1.08;--x0:-1.3%;--x1:1.3%;--y1:-.9%"><canvas class="st"></canvas><canvas class="an"></canvas></div>
      <div class="wl" id="wFore" style="--s0:1.02;--s1:1.1;--x0:-2.2%;--x1:2.2%;--y1:-1.2%"><canvas class="st"></canvas></div>
    </div>
    <!-- ② 地面：霧氣、積雪、反光（在人物後面） -->
    <canvas id="ground" class="full"></canvas>
    <!-- ③ 人物 -->
    <div id="chara"><canvas id="charaGL"></canvas></div>
    <!-- ④ 雪（WebGL） -->
    <canvas id="gl" class="full"></canvas>
    <!-- ⑤ 最前面：前景大雪花、風痕、結霜 -->
    <canvas id="front" class="full"></canvas>
    <div class="vignette"></div>
  </div>

  <div class="fps" id="fps">FPS --</div>

  <div class="panel" id="panel">
    <div class="row">雪量 <input type="range" id="amount" min="1" max="1000" step="1" value="2"> <span class="val" id="amountText">×2</span></div>
    <div class="row">人物大小 <input type="range" id="charaSize" min="0" max="100" step="1" value="80"> <span class="val" id="charaSizeText">80%</span></div>
    <div class="row">髮絲飄動 <input type="range" id="hairAmt" min="0" max="300" step="5" value="100"> <span class="val" id="hairAmtText">100%</span></div>
    <label class="row">換人物圖（去背 PNG）<span class="btn">選擇</span><input type="file" id="fileChara" accept="image/*"></label>
    <small id="note">雪量往右拉，看左上角 FPS 什麼時候開始掉，就知道手機的上限。手指在畫面上滑動，雪會被推開；傾斜手機有立體視差。</small>
  </div>
  <button class="toggle" id="toggle">隱藏面板</button>

<script src="world.js"></script>
<script>
// =====================================================================
// 1. 共用工具：Perlin 噪聲、亂數
// =====================================================================
const perm = new Uint8Array(512);
(() => { const p = [...Array(256).keys()]; for (let i = 255; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; } for (let i = 0; i < 512; i++) perm[i] = p[i & 255]; })();
const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
const lerp = (a, b, t) => a + (b - a) * t;
function grad2(h, x, y) { switch (h & 3) { case 0: return x + y; case 1: return -x + y; case 2: return x - y; default: return -x - y; } }
function noise(x, y) {                       // 回傳約 -1～1 的平滑亂數
  const X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
  x -= Math.floor(x); y -= Math.floor(y);
  const u = fade(x), v = fade(y), a = perm[X] + Y, b = perm[X + 1] + Y;
  return lerp(lerp(grad2(perm[a], x, y), grad2(perm[b], x - 1, y), u),
              lerp(grad2(perm[a + 1], x, y - 1), grad2(perm[b + 1], x - 1, y - 1), u), v);
}
const rand = (a, b) => a + Math.random() * (b - a);

// 畫面大小（你說跑得動，最高用到 3 倍解析度）
let W, H, dpr;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = Math.round(innerWidth * dpr); H = Math.round(innerHeight * dpr);
  layoutChara();
  makeFrost();
}

// 手指／滑鼠位置（推開雪花用）
const pointer = { x: -9999, y: -9999, active: false };
addEventListener('pointermove', e => { pointer.x = e.clientX * dpr; pointer.y = e.clientY * dpr; pointer.active = true; });
addEventListener('pointerdown', e => { pointer.x = e.clientX * dpr; pointer.y = e.clientY * dpr; pointer.active = true; });
addEventListener('pointerup', () => { pointer.active = false; });
addEventListener('pointerleave', () => { pointer.active = false; });

// 十字星芒
function star(c, x, y, size, alpha) {
  c.strokeStyle = `rgba(255,250,235,${alpha})`; c.lineWidth = Math.max(1, size * .08);
  c.beginPath(); c.moveTo(x - size, y); c.lineTo(x + size, y); c.moveTo(x, y - size); c.lineTo(x, y + size); c.stroke();
}

// =====================================================================
// 2. 風：平常是噪聲控制的微風，每 12～22 秒來一陣強風（4.5 秒內增強再減弱）
// =====================================================================
let wind = 0, gust = 0, windOffset = 0, windT = 0, nextGust = 8, gustT = -1;
function stepWind(dt) {
  windT += dt;
  if (gustT < 0 && windT > nextGust) gustT = 0;
  if (gustT >= 0) {
    gustT += dt;
    gust = Math.sin(Math.min(gustT / 4.5, 1) * Math.PI);          // 0 → 1 → 0
    if (gustT > 4.5) { gustT = -1; gust = 0; nextGust = windT + rand(12, 22); }
  }
  wind = (noise(windT * .08, 7.7) * 90 + gust * 260) * dpr;
  windOffset += wind * dt;
}

// =====================================================================
// 3. 視差：手機傾斜（或電腦滑鼠位置）讓各層移動不同距離，越近動越多
// =====================================================================
const par = { tx: 0, ty: 0, gx: 0, gy: 0, base: null, fx: { x: 0, y: 0 } };
addEventListener('deviceorientation', e => {
  if (e.gamma == null) return;
  if (par.base == null) par.base = e.beta;                          // 第一次讀到的角度當作「正中間」
  par.gx = Math.max(-1, Math.min(1, e.gamma / 25));
  par.gy = Math.max(-1, Math.min(1, (e.beta - par.base) / 25));
});
addEventListener('mousemove', e => { par.gx = (e.clientX / innerWidth - .5) * 2; par.gy = (e.clientY / innerHeight - .5) * 2; });
addEventListener('pointerdown', () => {                              // iPhone 要先問過才能讀傾斜角度
  if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission && !par.asked) {
    par.asked = true; DeviceOrientationEvent.requestPermission().catch(() => {});
  }
});
const parEls = [['wSky', 3], ['wFar', 6], ['wMid', 9], ['wNear', 13], ['wFore', 26], ['ground', 16], ['chara', 20], ['gl', 18], ['front', 28]]
  .map(([id, amt]) => [document.getElementById(id), amt]);
function stepParallax(dt) {
  const k = 1 - Math.pow(.02, dt);                                  // 平滑跟上，不會抖
  par.tx += (par.gx - par.tx) * k; par.ty += (par.gy - par.ty) * k;
  for (const [el, amt] of parEls) el.style.translate = `${(-par.tx * amt).toFixed(2)}px ${(-par.ty * amt).toFixed(2)}px`;
  par.fx.x = -par.tx * 18; par.fx.y = -par.ty * 18;
}

// 會照亮雪花的光：木屋窗戶和路燈（位置由 world.js 算）
let lamps = [];
function updateLamp() {
  lamps = WORLD.built ? worldLightsOnScreen().map(L => ({ x: (L.x - par.fx.x) * dpr, y: (L.y - par.fx.y) * dpr, r: L.r * dpr })) : [];
}

// =====================================================================
// 4. 雪（WebGL）：每片雪的位置由顯示卡用時間直接算
// =====================================================================
// CPU 只在一開始給每片雪 4 個亂數（起始 x、起始 y、景深 z、種子），之後完全交給 GPU
const glCanvas = document.getElementById('gl');
const gl = glCanvas.getContext('webgl2', { premultipliedAlpha: true, antialias: false });
let glProg, glBuf, glCount = 0, glTime = 0, amount = 2;
const glU = {};
const BASE_FLAKES = 260;

const VS = `#version 300 es
precision highp float;
in vec2 corner;              // 一個四邊形的角：(0,0) (1,0) (0,1) (1,1)
in vec4 seed;                // 每片雪：起始 x、起始 y、景深 z、種子
uniform vec2 res; uniform float time, dpr, windOff, wind; uniform vec3 pointer, lamp, lamp2;
out vec2 vLocal; out float vR, vL, vAlpha, vSoft, vSpark, vCrystal, vRot, vZ, vWarm;
void main() {
  float z = pow(seed.z, 1.6);                         // 遠的多、近的少
  float crystal = z > 0.86 ? 1.0 : 0.0;                // 最近的雪畫成六角結晶
  float r = (1.0 + z * 4.5) * dpr * (1.0 + crystal * 0.9);
  float speed = (35.0 + z * 120.0) * dpr * (1.0 - crystal * 0.25);
  float sway = 0.6 + seed.w;
  float H = res.y + 100.0, Wd = res.x * 1.3;
  // 位置：用時間直接算（掉出畫面就從上面重來 → mod）
  float y = mod(seed.y * H + speed * time, H) - 50.0;
  float x = seed.x * Wd + windOff * (0.3 + z) + sin(time * sway * 2.0 + seed.w * 40.0) * 6.0 * dpr;
  x = mod(x, Wd) - res.x * 0.15;
  vec2 head = vec2(x, y);
  vec2 vel = vec2(wind * (0.3 + z) + cos(time * sway * 2.0 + seed.w * 40.0) * 12.0 * dpr, speed);
  // 手指推開
  if (pointer.z > 0.5) {
    vec2 d = head - pointer.xy; float dist = length(d), R = 120.0 * dpr;
    if (dist < R && dist > 0.5) head += d / dist * (1.0 - dist / R) * 60.0 * dpr * (0.4 + z);
  }
  // 偶爾閃一下
  float ph = fract(time * 0.08 + seed.w * 13.7);
  float spark = (z > 0.4) ? smoothstep(0.0, 0.03, ph) * (1.0 - smoothstep(0.03, 0.1, ph)) * step(0.85, fract(seed.w * 91.3)) : 0.0;
  // 近的雪才有拖尾：長度 = 速度 × 0.05 秒
  float L = (z > 0.55 && crystal < 0.5) ? length(vel) * 0.05 : 0.0;
  float Rq = max(r * (z < 0.3 ? 1.5 : 1.0), spark * r * 4.0) + 1.0;
  vec2 dir = -normalize(vel), perp = vec2(-dir.y, dir.x);
  float a = mix(-Rq, L + Rq, corner.y), b = mix(-Rq, Rq, corner.x);
  vec2 pos = head + dir * a + perp * b;
  vLocal = vec2(a, b); vR = r * (z < 0.3 ? 1.5 : 1.0); vL = L; vAlpha = 0.35 + z * 0.65; vSoft = z < 0.3 ? 1.0 : 0.45; vSpark = spark;
  float ld = length(head - lamp.xy), ld2 = length(head - lamp2.xy);
  vWarm = max(lamp.z > 0.0 ? pow(clamp(1.0 - ld / lamp.z, 0.0, 1.0), 2.0) : 0.0,
              lamp2.z > 0.0 ? pow(clamp(1.0 - ld2 / lamp2.z, 0.0, 1.0), 2.0) : 0.0);   // 飄過窗戶或路燈時被照成橘色
  vCrystal = crystal; vRot = seed.w * 6.283 + time * (seed.y - 0.5) * 2.4; vZ = z;
  gl_Position = vec4(pos / res * 2.0 - 1.0, 0.0, 1.0) * vec4(1.0, -1.0, 1.0, 1.0);
}`;
const FS = `#version 300 es
precision mediump float;
in vec2 vLocal; in float vR, vL, vAlpha, vSoft, vSpark, vCrystal, vRot, vZ, vWarm;
out vec4 color;
void main() {
  float a = vLocal.x, b = vLocal.y;
  // 膠囊形：頭是圓的，後面拖一條漸漸變淡的尾巴
  float d = length(vec2(b, a - clamp(a, 0.0, vL)));
  float body = 1.0 - smoothstep(vR * (1.0 - vSoft), vR, d);
  float tail = vL > 0.0 ? mix(1.0, 0.1, clamp(a / max(vL, 0.001), 0.0, 1.0)) : 1.0;
  float alpha = body * tail * vAlpha;
  // 六角結晶：把角度摺進 60° 的扇形，只要畫「一支臂＋分岔」就會變成六支
  if (vCrystal > 0.5) {
    float R = vR, rr = length(vec2(a, b));
    float ang = atan(b, a) + vRot;
    float k = mod(ang, 1.0472) - 0.5236;
    vec2 q = rr * vec2(cos(k), sin(k));
    float w = max(0.9, R * 0.06);
    float arm = (1.0 - smoothstep(w, w + 1.0, abs(q.y))) * (1.0 - smoothstep(R * 0.7, R * 0.78, q.x));
    vec2 q1 = q - vec2(R * 0.38, 0.0); q1.y = abs(q1.y);
    float br1 = (1.0 - smoothstep(w * 0.8, w * 0.8 + 1.0, abs(q1.x * 0.866 - q1.y * 0.5))) * step(0.0, q1.x) * (1.0 - smoothstep(R * 0.18, R * 0.22, length(q1)));
    vec2 q2 = q - vec2(R * 0.56, 0.0); q2.y = abs(q2.y);
    float br2 = (1.0 - smoothstep(w * 0.8, w * 0.8 + 1.0, abs(q2.x * 0.866 - q2.y * 0.5))) * step(0.0, q2.x) * (1.0 - smoothstep(R * 0.11, R * 0.15, length(q2)));
    float halo = (1.0 - smoothstep(0.0, R, rr)) * 0.35;
    alpha = max(max(arm, max(br1, br2)) * 0.95, halo) * vAlpha;
  }
  // 星芒：十字形的細線
  if (vSpark > 0.0) {
    float s = vR * 4.0;
    float cross = max((1.0 - smoothstep(0.0, 1.2, abs(b))) * (1.0 - smoothstep(0.0, s, abs(a))),
                      (1.0 - smoothstep(0.0, 1.2, abs(a))) * (1.0 - smoothstep(0.0, s, abs(b))));
    alpha = max(alpha, cross * vSpark);
  }
  if (alpha < 0.003) discard;
  vec3 tint = mix(vec3(0.78, 0.85, 1.0), vec3(1.0), vZ);   // 遠的雪被月光照得偏藍，近的偏白
  tint = mix(tint, vec3(1.0, 0.78, 0.5), vWarm * 0.85);
  alpha = min(1.0, alpha * (1.0 + vWarm * 0.7));
  color = vec4(tint * alpha, alpha);   // 預乘透明度
}`;

function compile(g, vs, fs) {
  const sh = (type, src) => { const o = g.createShader(type); g.shaderSource(o, src); g.compileShader(o);
    if (!g.getShaderParameter(o, g.COMPILE_STATUS)) throw new Error(g.getShaderInfoLog(o)); return o; };
  const p = g.createProgram();
  g.attachShader(p, sh(g.VERTEX_SHADER, vs)); g.attachShader(p, sh(g.FRAGMENT_SHADER, fs)); g.linkProgram(p);
  if (!g.getProgramParameter(p, g.LINK_STATUS)) throw new Error(g.getProgramInfoLog(p));
  return p;
}

function snowInit() {
  glProg = compile(gl, VS, FS);
  gl.useProgram(glProg);
  ['res', 'time', 'dpr', 'windOff', 'wind', 'pointer', 'lamp', 'lamp2'].forEach(n => glU[n] = gl.getUniformLocation(glProg, n));
  const cb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, cb);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0,0, 1,0, 0,1, 1,1]), gl.STATIC_DRAW);
  const cLoc = gl.getAttribLocation(glProg, 'corner');
  gl.enableVertexAttribArray(cLoc); gl.vertexAttribPointer(cLoc, 2, gl.FLOAT, false, 0, 0);
  glBuf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, glBuf);
  const sLoc = gl.getAttribLocation(glProg, 'seed');
  gl.enableVertexAttribArray(sLoc); gl.vertexAttribPointer(sLoc, 4, gl.FLOAT, false, 0, 0);
  gl.vertexAttribDivisor(sLoc, 1);                       // instancing：同一個四邊形畫很多次，每次換一組亂數
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  snowBuild();
}
function snowBuild() {
  glCount = Math.round(BASE_FLAKES * amount);
  const data = new Float32Array(glCount * 4);
  for (let i = 0; i < data.length; i++) data[i] = Math.random();
  gl.bindBuffer(gl.ARRAY_BUFFER, glBuf); gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
}
function snowRender(dt) {
  glTime += dt;
  if (glCanvas.width !== W || glCanvas.height !== H) { glCanvas.width = W; glCanvas.height = H; }
  gl.viewport(0, 0, W, H);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform2f(glU.res, W, H); gl.uniform1f(glU.time, glTime); gl.uniform1f(glU.dpr, dpr);
  gl.uniform1f(glU.windOff, windOffset % (W * 1.3)); gl.uniform1f(glU.wind, wind);
  gl.uniform3f(glU.pointer, pointer.x - par.fx.x * dpr, pointer.y - par.fx.y * dpr, pointer.active ? 1 : 0);
  const L1 = lamps[0] || { x: 0, y: 0, r: 0 }, L2 = lamps[1] || { x: 0, y: 0, r: 0 };
  gl.uniform3f(glU.lamp, L1.x, L1.y, L1.r); gl.uniform3f(glU.lamp2, L2.x, L2.y, L2.r);
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, glCount);
}

// =====================================================================
// 5. 人物（WebGL）：用「頭髮遮罩」讓頭髮飄動
// =====================================================================
// 原理：hairmask.png 是一張黑白圖，白色 = 頭髮（越下面越白 = 髮尾動得越多，髮根不動）。
// 畫每個像素時，從原圖「旁邊一點點」的位置取顏色，偏移量 = 波動 × 遮罩的白度。
// 所以臉、衣服（遮罩是黑的）完全不動，只有頭髮像被風吹一樣擺動，而且波會從上往下傳。
const charaBox = document.getElementById('chara'), charaCanvas = document.getElementById('charaGL');
const cg = charaCanvas.getContext('webgl2', { premultipliedAlpha: true, alpha: true });
let charaProg, texImg, texMask, charaReady = false, charaT = 0, hairAmt = 1, charaSize = .8;
const cU = {};
const CVS = `#version 300 es
in vec2 p; out vec2 uv;
void main() { uv = vec2(p.x, 1.0 - p.y); gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }`;
const CFS = `#version 300 es
precision highp float;
in vec2 uv; out vec4 color;
uniform sampler2D img, mask; uniform float time, wind, gust, amt;
void main() {
  float m = texture(mask, uv).r * amt;
  // 兩道波疊在一起，相位跟高度有關 → 看起來像從髮根往髮尾傳下去
  float wave = sin(time * 1.6 - uv.y * 7.0) * 0.65 + sin(time * 2.7 - uv.y * 13.0 + 1.3) * 0.35;
  float a = 0.005 + 0.012 * gust;                      // 陣風來時擺得比較大
  vec2 off = vec2(wave * a + wind * 0.006, sin(time * 1.1 - uv.y * 5.0) * a * 0.25) * m;
  color = texture(img, uv - off);
  // 原圖的上緣和左緣是被切掉的直線，淡出才不會看到一條硬邊
  color *= smoothstep(0.0, 0.09, uv.y) * smoothstep(0.0, 0.06, uv.x);
}`;
function charaInit() {
  charaProg = compile(cg, CVS, CFS);
  cg.useProgram(charaProg);
  ['img', 'mask', 'time', 'wind', 'gust', 'amt'].forEach(n => cU[n] = cg.getUniformLocation(charaProg, n));
  const b = cg.createBuffer(); cg.bindBuffer(cg.ARRAY_BUFFER, b);
  cg.bufferData(cg.ARRAY_BUFFER, new Float32Array([0,0, 1,0, 0,1, 1,1]), cg.STATIC_DRAW);
  const loc = cg.getAttribLocation(charaProg, 'p'); cg.enableVertexAttribArray(loc); cg.vertexAttribPointer(loc, 2, cg.FLOAT, false, 0, 0);
  cg.pixelStorei(cg.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
  texImg = cg.createTexture(); texMask = cg.createTexture();
  cg.uniform1i(cU.img, 0); cg.uniform1i(cU.mask, 1);
}
function setTex(tex, unit, source) {
  cg.activeTexture(cg.TEXTURE0 + unit); cg.bindTexture(cg.TEXTURE_2D, tex);
  cg.texImage2D(cg.TEXTURE_2D, 0, cg.RGBA, cg.RGBA, cg.UNSIGNED_BYTE, source);
  cg.texParameteri(cg.TEXTURE_2D, cg.TEXTURE_MIN_FILTER, cg.LINEAR); cg.texParameteri(cg.TEXTURE_2D, cg.TEXTURE_MAG_FILTER, cg.LINEAR);
  cg.texParameteri(cg.TEXTURE_2D, cg.TEXTURE_WRAP_S, cg.CLAMP_TO_EDGE); cg.texParameteri(cg.TEXTURE_2D, cg.TEXTURE_WRAP_T, cg.CLAMP_TO_EDGE);
}
const loadImg = src => new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = src; });
let charaAspect = 1;
async function loadChara(src, maskSrc) {
  const img = await loadImg(src);
  charaAspect = img.width / img.height;
  setTex(texImg, 0, img);
  if (maskSrc) setTex(texMask, 1, await loadImg(maskSrc));
  else { const c = document.createElement('canvas'); c.width = c.height = 1; setTex(texMask, 1, c); }   // 自己的圖沒有頭髮遮罩：不飄
  charaReady = true;
  layoutChara();
}
// 人物大小：寬度是畫面寬的 charaSize（但不超過畫面高的 85%），貼齊右下角
function layoutChara() {
  if (!charaBox) return;
  const show = charaSize > 0.01;
  charaBox.style.display = show ? 'block' : 'none';
  let w = innerWidth * charaSize, h = w / charaAspect;
  if (h > innerHeight * .85) { h = innerHeight * .85; w = h * charaAspect; }
  charaBox.style.width = w + 'px'; charaBox.style.height = h + 'px';
  const cw = Math.round(w * dpr), ch = Math.round(h * dpr);
  if (charaCanvas.width !== cw || charaCanvas.height !== ch) { charaCanvas.width = cw; charaCanvas.height = ch; }
}
function charaRender(dt) {
  if (!charaReady || charaSize <= 0.01) return;
  charaT += dt;
  cg.viewport(0, 0, charaCanvas.width, charaCanvas.height);
  cg.clearColor(0, 0, 0, 0); cg.clear(cg.COLOR_BUFFER_BIT);
  cg.uniform1f(cU.time, charaT);
  cg.uniform1f(cU.wind, Math.max(-1, Math.min(1, wind / dpr / 300)));
  cg.uniform1f(cU.gust, gust);
  cg.uniform1f(cU.amt, hairAmt);
  cg.drawArrays(cg.TRIANGLE_STRIP, 0, 4);
}

// =====================================================================
// 6. 地面（人物後面）和最前面的效果
// =====================================================================
const groundCv = document.getElementById('ground'), gctx = groundCv.getContext('2d');
const front = document.getElementById('front'), fctx = front.getContext('2d');
const BOKEH = Array.from({ length: 7 }, () => ({ x: Math.random(), y: Math.random(), r: rand(28, 70), a: rand(.1, .22), sp: rand(160, 300) }));
const GLINT = Array.from({ length: 36 }, () => ({ x: Math.random(), y: Math.random(), ph: rand(0, 6.28), sp: rand(.5, 1.5) }));
let ambTime = 0, snowDepth = 0, frostLevel = 0, frostTex = null;

function ambient(dt) {
  ambTime += dt;
  worldFrame(dt);                                     // 星星、極光、流星、燈火、炊煙、湖面倒影（world.js）

  // ---- 地面：霧氣、積雪、反光 ----
  for (const c of [groundCv, front]) if (c.width !== W || c.height !== H) { c.width = W; c.height = H; }
  gctx.clearRect(0, 0, W, H);
  for (let i = 0; i < 2; i++) {                       // 兩團很淡的霧慢慢橫向飄
    const x = ((ambTime * (12 + i * 7) * dpr + i * W * .6) % (W * 1.8)) - W * .4, y = H * (.8 + i * .07);
    const fg = gctx.createRadialGradient(x, y, 0, x, y, W * .7);
    fg.addColorStop(0, 'rgba(220,230,248,.16)'); fg.addColorStop(1, 'rgba(220,230,248,0)');
    gctx.fillStyle = fg; gctx.save(); gctx.translate(x, y); gctx.scale(1, .25); gctx.translate(-x, -y);
    gctx.fillRect(x - W * .7, y - W * .7, W * 1.4, W * 1.4); gctx.restore();
  }
  snowDepth = Math.min(1, snowDepth + dt / 90);       // 積雪：前 90 秒慢慢堆高
  const top = H * (1 - .015 - .035 * snowDepth);
  const sg = gctx.createLinearGradient(0, top - 10 * dpr, 0, H);
  sg.addColorStop(0, 'rgba(240,245,255,0)'); sg.addColorStop(.25, 'rgba(240,245,255,.92)'); sg.addColorStop(1, 'rgba(225,233,248,1)');
  gctx.fillStyle = sg; gctx.beginPath(); gctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 8 * dpr) gctx.lineTo(x, top - (noise(x / (90 * dpr), 1.7) * 9 + Math.sin(x / (40 * dpr)) * 2) * dpr * (.4 + snowDepth));
  gctx.lineTo(W, H); gctx.fill();
  gctx.globalCompositeOperation = 'lighter';
  for (const g of GLINT) {                            // 積雪上的反光
    const a = Math.pow(Math.max(0, Math.sin(ambTime * g.sp + g.ph)), 12);
    if (a < .02) continue;
    gctx.globalAlpha = a; star(gctx, g.x * W, top + 6 * dpr + g.y * (H - top - 6 * dpr), 4 * dpr, 1);
  }
  gctx.globalAlpha = 1; gctx.globalCompositeOperation = 'source-over';

  // ---- 最前面：風痕、結霜、前景大雪花 ----
  fctx.clearRect(0, 0, W, H);
  if (gust > .05) {
    fctx.strokeStyle = `rgba(230,238,255,${.07 * gust})`; fctx.lineWidth = 1.2 * dpr; fctx.lineCap = 'round';
    for (let k = 0; k < 9; k++) {
      const yy = ((k * 0.137 + ambTime * .05) % 1) * H * .9, xx = ((ambTime * (900 + k * 70) * dpr + k * 397 * dpr) % (W * 2)) - W * .5;
      const len = (120 + k * 25) * dpr * gust;
      fctx.beginPath(); fctx.moveTo(xx, yy); fctx.quadraticCurveTo(xx + len * .5, yy - 10 * dpr, xx + len, yy + 4 * dpr); fctx.stroke();
    }
  }
  frostLevel = Math.min(1, frostLevel + dt / 120);   // 螢幕四角慢慢結霜（2 分鐘結滿）
  if (frostTex) { fctx.globalAlpha = frostLevel * .85; fctx.drawImage(frostTex, 0, 0); fctx.globalAlpha = 1; }
  for (const b of BOKEH) {                            // 前景大雪花：很靠近鏡頭、很大、很糊
    b.y += b.sp * dt / (H / dpr); b.x += (wind / dpr * 1.6 + 20) * dt / (W / dpr);
    if (b.y > 1.15) { b.y = -.15; b.x = Math.random(); }
    if (b.x > 1.15) b.x = -.15;
    const x = b.x * W, y = b.y * H, r = b.r * dpr;
    const bg2 = fctx.createRadialGradient(x, y, 0, x, y, r);
    bg2.addColorStop(0, `rgba(235,242,255,${b.a})`); bg2.addColorStop(.6, `rgba(235,242,255,${b.a * .5})`); bg2.addColorStop(1, 'rgba(235,242,255,0)');
    fctx.fillStyle = bg2; fctx.beginPath(); fctx.arc(x, y, r, 0, 7); fctx.fill();
  }
}

// 結霜貼圖：從四個角長出樹枝狀的冰紋（換畫面大小時重畫一次）
function makeFrost() {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  const corners = [[0, 0, 1, 1], [W, 0, -1, 1], [0, H, 1, -1], [W, H, -1, -1]];
  for (const [cx, cy, sx, sy] of corners) {
    const R = Math.min(W, H) * .42;
    const gr = g.createRadialGradient(cx, cy, 0, cx, cy, R);
    gr.addColorStop(0, 'rgba(235,242,255,.45)'); gr.addColorStop(.5, 'rgba(235,242,255,.12)'); gr.addColorStop(1, 'rgba(235,242,255,0)');
    g.fillStyle = gr; g.fillRect(cx - R, cy - R, R * 2, R * 2);
    g.strokeStyle = 'rgba(245,250,255,.35)'; g.lineCap = 'round';
    const branch = (x, y, ang, len, depth) => {
      if (depth > 4 || len < 4 * dpr) return;
      let px = x, py = y;
      g.lineWidth = Math.max(.6, (5 - depth) * .45) * dpr;
      g.beginPath(); g.moveTo(px, py);
      for (let k = 0; k < 6; k++) { ang += rand(-.25, .25); px += Math.cos(ang) * len / 6; py += Math.sin(ang) * len / 6; g.lineTo(px, py); }
      g.stroke();
      const n = 2 + Math.floor(Math.random() * 2);
      for (let k = 0; k < n; k++) {
        const t = rand(.3, .9);
        branch(x + (px - x) * t, y + (py - y) * t, ang + (Math.random() < .5 ? -1 : 1) * rand(.5, 1.1), len * rand(.35, .6), depth + 1);
      }
    };
    const baseAng = Math.atan2(sy, sx);
    for (let k = 0; k < 7; k++) branch(cx, cy, baseAng + rand(-.75, .75), Math.min(W, H) * rand(.12, .28), 0);
  }
  frostTex = c;
}

// =====================================================================
// 7. 主迴圈＋FPS
// =====================================================================
const fpsEl = document.getElementById('fps');
let last = performance.now(), frames = 0, fpsTime = 0;
function loop(now) {
  const dt = Math.min((now - last) / 1000, 1 / 20);    // 用經過的時間算移動，60Hz 和 120Hz 螢幕速度一樣
  last = now;
  stepWind(dt);
  stepParallax(dt);
  updateLamp();
  ambient(dt);
  charaRender(dt);
  snowRender(dt);
  frames++; fpsTime += dt;
  if (fpsTime >= .5) {
    const fps = Math.round(frames / fpsTime);
    fpsEl.textContent = `FPS ${fps}・雪 ${glCount.toLocaleString()} 片`;
    fpsEl.classList.toggle('low', fps < 50);
    frames = 0; fpsTime = 0;
  }
  requestAnimationFrame(loop);
}

// =====================================================================
// 8. 面板
// =====================================================================
const $ = id => document.getElementById(id);
$('amount').oninput = e => { amount = +e.target.value; $('amountText').textContent = '×' + amount; snowBuild(); };
$('charaSize').oninput = e => { charaSize = e.target.value / 100; $('charaSizeText').textContent = e.target.value + '%'; layoutChara(); };
$('hairAmt').oninput = e => { hairAmt = e.target.value / 100; $('hairAmtText').textContent = e.target.value + '%'; };
$('fileChara').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  loadChara(URL.createObjectURL(f), null);
  $('note').textContent = '自己的圖沒有頭髮遮罩，所以頭髮不會飄。重新整理頁面就會換回原本的人物。';
});
$('toggle').onclick = e => {
  $('panel').classList.toggle('hide');
  e.target.textContent = $('panel').classList.contains('hide') ? '顯示面板' : '隱藏面板';
};
$('panel').addEventListener('pointermove', e => e.stopPropagation());   // 在面板上操作不要推開雪

// =====================================================================
// 9. 開始
// =====================================================================
let resizeTimer = 0;
addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 150); });
resize();
buildWorld();
if (!gl || !cg) {
  $('note').textContent = '這個瀏覽器不支援 WebGL2，看不到雪和人物。請換 Chrome、Edge 或 Safari 的新版本。';
} else {
  snowInit();
  charaInit();
  loadChara('chara.webp', 'hairmask.png').catch(() => { $('note').textContent = '人物圖載入失敗。'; });
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) requestAnimationFrame(loop);
}
</script>
</body>
